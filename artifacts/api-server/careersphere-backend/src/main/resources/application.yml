server:
  port: ${PORT:5000}
  address: 0.0.0.0
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
spring:
  application:
    name: careersphere-api
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/careersphere;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
app:
  security:
    jwt-secret: ${JWT_SECRET:${SESSION_SECRET:}}
    jwt-ttl-hours: ${JWT_TTL_HOURS:12}
    cookie-secure: ${COOKIE_SECURE:true}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN:https://*.replit.dev,https://*.replit.app,http://localhost:*,http://127.0.0.1:*}
ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    endpoint: https://generativelanguage.googleapis.com/v1beta/models
